title: Accès mémoire suspect au processus LSASS
id: 3eecbccd-7497-4107-9b9a-eda118bf633d
status: experimental
description: |
  Détecte l'ouverture d'un handle sur lsass.exe avec des droits permettant la lecture
  de sa mémoire. C'est le geste commun à Mimikatz, procdump, comsvcs.dll et à la
  plupart des outils de vol d'identifiants : quel que soit l'outil, il faut ce handle.
  On détecte donc le geste inévitable, pas l'outil.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Mamadou Lamine Thiore (Junior)
date: 2026-09-14
modified: 2026-10-02
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    # Filtre en chemin COMPLET, et non en |endswith. Un filtre d'exclusion est la
    # porte de sortie de la règle : s'il accepte n'importe quel binaire dont le nom
    # se termine par \svchost.exe, il suffit à un attaquant de nommer ainsi son
    # outil pour disparaître. Une exclusion se verrouille toujours au chemin.
    filter_systeme:
        SourceImage:
            - 'C:\Windows\System32\csrss.exe'
            - 'C:\Windows\System32\wininit.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\System32\taskmgr.exe'
            - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
    # Defender vit sous un chemin versionné qui change à chaque mise à jour du
    # moteur : on ancre le préfixe plutôt qu'un chemin exact.
    filter_defender:
        SourceImage|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
        SourceImage|endswith: '\MsMpEng.exe'
    condition: selection and not 1 of filter_*
falsepositives:
    - Outils d'inventaire ou d'EDR non listés dans le filtre — à relever et ajouter
      au filtre après vérification de la signature du binaire source.
    - Sauvegarde ou supervision applicative interrogeant les processus système.
    - "csrss.exe et wininit.exe ouvrent un handle 0x1fffff sur LSASS au démarrage de
      Windows : 14 occurrences sur le journal du 20/09 au 02/10/2026. Ajoutés au
      filtre en chemin complet le 02/10/2026."
level: high