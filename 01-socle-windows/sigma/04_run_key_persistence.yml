title: Écriture d'une valeur dans une clé de démarrage automatique
id: 96278840-36bf-4479-b427-953d0ea108c4
status: experimental
description: |
  Détecte l'ajout d'une valeur dans les clés Run et RunOnce. Persistance la plus
  ancienne et toujours la plus utilisée, parce qu'elle ne demande aucun privilège
  particulier côté utilisateur. Cette règle s'appuie sur l'événement Sysmon 13
  (modification de valeur de registre) : sans la section RegistryEvent activée dans
  la configuration Sysmon, elle ne produira jamais rien.
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Mamadou Lamine Thiore (Junior)
date: 2026-09-14
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection_key:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunServices\'
    selection_suspicious_path:
        Details|contains:
            - '\AppData\'
            - '\Users\Public\'
            - '\Windows\Temp\'
            - 'powershell'
            - 'cmd.exe /c'
            - 'rundll32'
            - 'mshta'
    # OneDrive ecrit des entrees RunOnce de nettoyage dont le Details reference
    # \AppData\ : 4 faux positifs constates le 01/10/2026. On ancre sur DEUX
    # champs, le binaire ET la forme de la commande — un seul serait trop facile
    # a imiter. Limite assumee : filtre sur nom de binaire, impossible a
    # verrouiller sur un chemin absolu puisque OneDrive s'installe dans le
    # profil utilisateur. A compenser par une verification de signature (module 04).
    filter_onedrive:
        Image|endswith:
            - '\Microsoft\OneDrive\Update\OneDriveSetup.exe'
            - '\Microsoft\OneDrive\StandaloneUpdater\OneDriveSetup.exe'
        Details|startswith: 'C:\WINDOWS\system32\cmd.exe /q /c '
    condition: all of selection_* and not 1 of filter_*
falsepositives:
    - Applications installées dans le profil utilisateur (navigateurs, clients de
      messagerie instantanée) qui s'enregistrent au démarrage depuis AppData.
    - À affiner — vérifier la signature du binaire pointé par Details.
    - "OneDriveSetup.exe : entrees RunOnce de nettoyage apres mise a jour,
      4 occurrences le 01/10/2026 — filtrees depuis."
level: high
