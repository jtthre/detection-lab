title: Création d'une tâche planifiée en ligne de commande
id: b8c04658-f1d8-49f5-98b7-cf3fd04c5996
status: experimental
description: |
  Détecte la création d'une tâche planifiée via schtasks.exe. C'est un mécanisme de
  persistance de premier choix : il survit au redémarrage, s'exécute sous un compte
  choisi, et se fond dans l'administration légitime. Le volume est faible sur un
  poste utilisateur, ce qui rend la règle exploitable ; sur un serveur, il faudra
  filtrer par compte.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Mamadou Lamine Thiore (Junior)
date: 2026-09-14
modified: 2026-10-27
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\schtasks.exe'
        - OriginalFileName: 'schtasks.exe'
    selection_create:
        CommandLine|contains:
            - ' /create'
            - ' -create'
    # v2 (module 04) : Sysmon écrit le compte en un seul bloc (« AUTORITE NT\Système »),
    # Elastic Agent le sépare en user.domain + user.name (« Système »). La v1 ne filtrait que
    # la forme Sysmon : dans le SIEM, l'exclusion ne s'appliquait jamais. On garde les deux
    # formes, en français et en anglais. Surtout pas de filtre sur user.id : dans les données
    # de l'agent, il vaut S-1-5-18 sur TOUS les événements Sysmon (c'est le compte du service
    # Sysmon, pas celui du processus) — voir 04-siem/preuves/releve-champs-windows.md.
    filter_system_account:
        - User|contains:
            - 'AUTORITE NT\Système'
            - 'AUTHORITY\SYSTEM'
        - User:
            - 'Système'
            - 'SYSTEM'
    condition: all of selection_* and not filter_system_account
falsepositives:
    - Scripts d'installation logicielle créant leurs propres tâches de mise à jour.
    - Outils de déploiement de parc — à filtrer par processus parent une fois identifiés.
level: medium
