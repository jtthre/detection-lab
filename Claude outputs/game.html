<title>PhishDojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : une seule colonne de lecture (~680px), alignee a gauche ; l'adresse a analyser
   est l'element-signature, posee en grand dans une « loupe ». Theme clair assume. */
:root {
  --paper: #F3F6F1;       /* papier de riz froid */
  --surface: #FFFFFF;
  --ink: #1B2550;         /* indigo aizome, couleur des keikogi */
  --ink-soft: #545C7E;
  --tatami: #D9E1C6;      /* paille de tatami, filets et surfaces calmes */
  --tatami-deep: #B9C59C;
  --gold: #E3B12F;        /* recompenses, ceintures */
  --ok: #1E8657;
  --ko: #C0394C;
  --doubt: #A8701A;
  --ok-bg: #E3F3EA;
  --ko-bg: #FBE6E9;
  --doubt-bg: #F8EDD9;
  --f-display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 14px;
  color-scheme: light;
}
html, body { background: var(--paper); color: var(--ink); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 0 48px; }
.app { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
#screen { display: flex; flex-direction: column; gap: 32px; }
.demo { display: flex; flex-direction: column; gap: 10px; }
.demo .loupe { box-shadow: 4px 4px 0 var(--tatami-deep); padding: 16px 18px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---- barre du haut */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 0; }
.mark { font-family: var(--f-display); font-size: 22px; letter-spacing: .01em; display: flex; align-items: center; gap: 10px; }
.mark svg { width: 30px; height: 30px; }
.top-right { display: flex; align-items: center; gap: 10px; }
.lang { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.lang button { background: transparent; border: 0; padding: 4px 12px; font-weight: 700; font-size: 13px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.hud { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-weight: 700; }
.hud span { white-space: nowrap; }

/* ---- accueil */
.hero { display: flex; flex-direction: column; gap: 14px; padding-block: 8px 4px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 12vw, 84px); line-height: .95; margin: 0; text-wrap: balance; }
.hero p { margin: 0; font-size: 18px; max-width: 34em; color: var(--ink-soft); }
.belt-strip { display: flex; height: 12px; border-radius: 6px; overflow: hidden; max-width: 320px; box-shadow: inset 0 0 0 2px var(--ink); }
.belt-strip i { flex: 1; }
.block { display: flex; flex-direction: column; gap: 12px; }
.block h2 { font-size: 15px; font-weight: 700; margin: 0; color: var(--ink-soft); }
.field { width: 100%; max-width: 360px; padding: 12px 14px; border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); }
.avatars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; max-width: 420px; }
.avatar { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px solid var(--tatami-deep); background: var(--surface); display: grid; place-items: center; padding: 18%; }
.avatar svg { width: 100%; height: 100%; }
.avatar[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--gold); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mode { text-align: left; background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: transform .12s ease; }
.mode:hover { transform: translateY(-2px); }
.mode strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.mode span { color: var(--ink-soft); font-size: 14px; }
.mode .count { font-weight: 700; color: var(--ink); }
.mode[disabled] { border-style: dashed; cursor: default; transform: none; }
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 2px solid var(--tatami); }
.board li { display: grid; grid-template-columns: 28px 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px solid var(--tatami); font-variant-numeric: tabular-nums; }
.board .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .mini { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 2px solid var(--tatami-deep); padding: 4px; }
.board .score { font-weight: 700; }
.muted { color: var(--ink-soft); }
.res { display: flex; flex-direction: column; gap: 6px; margin: 0; padding-left: 18px; }
.res a { color: var(--ink); font-weight: 600; }

/* ---- partie */
.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 8px; border-radius: 4px; background: var(--tatami); }
.progress i.done-ok { background: var(--ok); }
.progress i.done-ko { background: var(--ko); }
.progress i.now { background: var(--ink); }
.prompt { font-size: 20px; font-weight: 700; margin: 0; text-wrap: balance; }
.loupe { background: var(--surface); border: 3px solid var(--ink); border-radius: 22px; padding: 22px 20px; box-shadow: 6px 6px 0 var(--tatami-deep); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.addr { font-family: var(--f-mono); font-size: clamp(17px, 4.4vw, 24px); line-height: 1.5; overflow-wrap: anywhere; margin: 0; }
.addr .dim { color: var(--ink-soft); }
.addr .reg { font-weight: 600; }
.revealed .addr .dim { opacity: .55; }
.revealed .addr .reg { background: var(--gold); color: var(--ink); border-radius: 6px; padding: 0 4px; box-decoration-break: clone; }
.legend { font-size: 14px; color: var(--ink-soft); margin: 0; }
.legend b { color: var(--ink); background: var(--gold); padding: 0 4px; border-radius: 4px; font-family: var(--f-mono); font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.choice { border: 2px solid var(--ink); background: var(--surface); border-radius: var(--r); padding: 14px 12px; font-weight: 700; min-height: 54px; }
.choice:hover:not([disabled]) { background: var(--ink); color: var(--paper); }
.choice[disabled] { cursor: default; opacity: .45; }
.choice.picked { opacity: 1; }
.choice.right { opacity: 1; border-color: var(--ok); background: var(--ok-bg); }
.choice.wrong { opacity: 1; border-color: var(--ko); background: var(--ko-bg); }
.feedback { border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; border: 2px solid; }
.feedback.ok { background: var(--ok-bg); border-color: var(--ok); }
.feedback.ko { background: var(--ko-bg); border-color: var(--ko); }
.feedback h3 { margin: 0; font-size: 18px; }
.feedback p { margin: 0; }
.gain { font-variant-numeric: tabular-nums; font-weight: 700; }
.ai { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding-top: 8px; border-top: 2px dashed currentColor; }
.ai .meter { height: 10px; border-radius: 5px; background: var(--tatami); position: relative; overflow: visible; }
.ai .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--ink); }
.ai .meter b { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ko); }
.ai small { grid-column: 1 / -1; color: var(--ink-soft); }
.next { align-self: flex-start; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 700; }

/* ---- fin */
.end { display: flex; flex-direction: column; gap: 22px; }
.belt-card { background: var(--surface); border: 3px solid var(--ink); border-radius: 22px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 6px 6px 0 var(--tatami-deep); }
.belt-card .grade { font-family: var(--f-display); font-size: clamp(32px, 8vw, 52px); line-height: 1; margin: 0; }
.belt { width: 100%; max-width: 360px; height: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { border-top: 3px solid var(--ink); padding-top: 6px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 28px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--ink-soft); }
.share { display: flex; flex-direction: column; gap: 8px; }
.share textarea { width: 100%; min-height: 90px; border: 2px solid var(--tatami-deep); border-radius: var(--r); padding: 10px 12px; background: var(--surface); resize: vertical; font: inherit; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.ghost { background: transparent; border: 2px solid var(--ink); border-radius: 999px; padding: 10px 20px; font-weight: 700; }
.foot { font-size: 13px; color: var(--ink-soft); border-top: 2px solid var(--tatami); padding-top: 14px; }
.foot a { color: var(--ink); }

@media (prefers-reduced-motion: no-preference) {
  .belt-card.pop { animation: pop .7s cubic-bezier(.2, .9, .3, 1.3) both; }
  .belt-card.pop .belt rect.knot { transform-box: fill-box; transform-origin: 50% 50%; animation: tie .9s .25s ease-out both; }
  @keyframes pop { from { transform: scale(.85) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes tie { from { transform: scaleX(0); } to { transform: scaleX(1); } }
}
@media (max-width: 480px) {
  .avatars { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 260px; }
  .top-right { width: 100%; justify-content: space-between; }
  .hud { gap: 12px; font-size: 14px; }
  .loupe { padding: 18px 14px; }
}
</style>

<div class="app">
  <header class="top">
    <div class="mark" aria-label="PhishDojo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1B2550"/><path d="M9 17c3-6 11-7 15-2-3 1-5 3-6 6-3-1-6-2-9-4z" fill="#E3B12F"/><circle cx="20" cy="15" r="1.4" fill="#1B2550"/><path d="M8 22h16" stroke="#F3F6F1" stroke-width="2.4" stroke-linecap="round"/></svg>
      PhishDojo
    </div>
    <div class="top-right">
      <div class="hud" id="hud" hidden><span id="hudScore"></span><span id="hudStreak"></span></div>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" id="lang-fr" aria-pressed="true">FR</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="screen"></main>

  <footer class="foot" id="foot"></footer>
</div>
